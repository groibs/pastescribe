name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install worker system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install uv==0.11.18

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install worker dependencies
        run: uv sync --project apps/worker --extra dev

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  db-migrations-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL and pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
          sudo service postgresql start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"

      - name: Run migrations and RLS tests (pgTAP)
        run: bash scripts/test-db-local.sh
